<div class="modal-ov" id="confirmModal" onclick="if(event.target===this)closeModal('confirmModal')">
  <div class="modal-box modal-sm">
    <div class="confirm-wrap">
      <div class="confirm-icon"><i class="ph-bold ph-trash"></i></div>
      <h3>Apagar Historico</h3>
      <p>Deseja apagar todo o historico de acessos de hoje? Esta acao nao pode ser desfeita.</p>
      <div class="confirm-btns">
        <button class="btn-sec" onclick="closeModal('confirmModal')">Cancelar</button>
        <button class="btn-danger" onclick="clearHistory()">Apagar tudo</button>
      </div>
    </div>
  </div>
</div>
