<!-- MODAL: Novo Cliente -->
<div class="modal-ov" id="novoClienteModal" onclick="if(event.target===this)closeModal('novoClienteModal')">
  <div class="modal-box">
    <button class="modal-x" onclick="closeModal('novoClienteModal')"><i class="ph-bold ph-x"></i></button>
    <div style="padding:22px">
      <h3 style="font-size:20px;font-weight:700;color:var(--c-text);margin-bottom:4px;padding-bottom:12px;border-bottom:1px solid var(--c-border)">Novo Cliente</h3>
      <div class="m-form" style="margin-top:14px">
        <label>Nome completo<input type="text" id="ncNome" placeholder="Nome completo do cliente"/></label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <label>Telefone<input type="tel" id="ncTel" placeholder="(11) 9xxxx-xxxx"/></label>
          <label>E-mail<input type="email" id="ncEmail" placeholder="email@exemplo.com"/></label>
        </div>
        <label>Segmento<select id="ncSegmento">
          <option value="Padrao">Padrao</option>
          <option value="Familia">Familia</option>
          <option value="Executivo">Executivo</option>
          <option value="Premium">Premium</option>
          <option value="VIP">VIP</option>
        </select></label>
        <label>Status<select id="ncStatus">
          <option value="potencial">Potencial</option>
          <option value="ativo">Ativo</option>
          <option value="inativo">Inativo</option>
        </select></label>
        <label>Observacoes<textarea id="ncObs" placeholder="Observacoes sobre o cliente..." style="height:70px;padding:8px 10px;border:1px solid var(--c-border);border-radius:var(--rsm);font-size:var(--fs1);background:var(--c-input);color:var(--c-text);resize:vertical;font-family:inherit;transition:var(--tr)"></textarea></label>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
        <button class="btn-sec" onclick="closeModal('novoClienteModal')">Cancelar</button>
        <button class="btn-prim" onclick="salvarNovoCliente()">Cadastrar Cliente</button>
      </div>
    </div>
  </div>
</div>
