    <div style="padding:22px">
      <h3 id="kpiModalTitle" style="font-size:20px;font-weight:700;color:var(--c-text);margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--c-border)"></h3>
      <div id="kpiModalBody"></div>
    </div>
    <div style="padding:0 22px 20px;text-align:right"><button class="btn-prim" onclick="closeModal('kpiModal')">Fechar</button></div>
  </div>
