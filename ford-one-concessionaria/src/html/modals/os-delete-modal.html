<!-- MODAL: Confirmar exclusão OS -->
<div class="modal-ov" id="osDeleteModal" onclick="if(event.target===this)closeModal('osDeleteModal')">
  <div class="modal-box modal-sm">
    <div class="confirm-wrap">
      <div class="confirm-icon"><i class="ph-bold ph-trash"></i></div>
      <h3 id="osDeleteTitle">Excluir OS</h3>
      <p id="osDeleteMsg">Deseja excluir esta OS? Esta ação não pode ser desfeita.</p>
      <div class="confirm-btns">
        <button class="btn-sec" onclick="closeModal('osDeleteModal')">Cancelar</button>
        <button class="btn-danger" id="osDeleteConfirmBtn">Excluir</button>
      </div>
    </div>
  </div>
</div>
