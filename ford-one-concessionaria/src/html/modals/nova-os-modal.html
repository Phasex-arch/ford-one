<!-- MODAL: Nova OS -->
<div class="modal-ov" id="novaOSModal" onclick="if(event.target===this)closeModal('novaOSModal')">
  <div class="modal-box">
    <button class="modal-x" onclick="closeModal('novaOSModal')"><i class="ph-bold ph-x"></i></button>
    <div style="padding:22px">
      <h3 style="font-size:20px;font-weight:700;color:var(--c-text);margin-bottom:4px;padding-bottom:12px;border-bottom:1px solid var(--c-border)">Nova Ordem de Servico</h3>
      <div class="m-form" style="margin-top:14px">
        <label>Nome do cliente<input type="text" id="osCliente" placeholder="Nome completo do cliente"/></label>
        <label>Veiculo<input type="text" id="osVeiculo" placeholder="Modelo, versao e ano"/></label>
        <label>Tipo de servico<select id="osTipoServico">
          <option value="">Selecione...</option>
          <option>Revisao programada</option>
          <option>Reparo mecanico</option>
          <option>Funilaria e Pintura</option>
          <option>Eletrica e Eletronica</option>
          <option>Suspensao e Freios</option>
          <option>Troca de pecas</option>
          <option>Higienizacao</option>
          <option>Outro</option>
        </select></label>
        <label>Tecnico responsavel<select id="osTecnico">
          <option value="">Selecione o tecnico...</option>
        </select></label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <label>Data<input type="date" id="osData"/></label>
          <label>Horario<input type="time" id="osHorario" value="08:00"/></label>
        </div>
        <label>Prioridade<select id="osPrioridade">
          <option value="normal">Normal</option>
          <option value="alta">Alta</option>
          <option value="urgente">Urgente</option>
        </select></label>
        <label>Observacoes<textarea id="osObs" placeholder="Observacoes adicionais..." style="height:80px;padding:8px 10px;border:1px solid var(--c-border);border-radius:var(--rsm);font-size:var(--fs1);background:var(--c-input);color:var(--c-text);resize:vertical;font-family:inherit;transition:var(--tr)"></textarea></label>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
        <button class="btn-sec" onclick="closeModal('novaOSModal')">Cancelar</button>
        <button class="btn-prim" onclick="salvarNovaOS()">Criar OS</button>
      </div>
    </div>
  </div>
</div>
