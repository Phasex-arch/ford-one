  <!-- Placeholders preenchidos pelo html-loader.js -->
  <div id="header-placeholder"></div>

  <div class="app-layout" id="appLayout">
    <div id="sidebar-placeholder"></div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobile()"></div>
    <main class="main" id="mainContent">
      <div id="sections-placeholder"></div>
    </main>
  </div>

  <div id="modals-placeholder"></div>
  <div class="toast-ct" id="toastContainer"></div>

  <!--
    html-loader.js:
    1. Injeta os HTMLs parciais (header, sidebar, sections, modals)
    2. Carrega os JS modulares em ordem — só depois do DOM estar completo
  -->
  <script src="src/js/app/html-loader.js"></script>
